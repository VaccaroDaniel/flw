<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Watch Lesson - Unit Video</title>
<link href="style.css" rel="stylesheet">
<link href="assets/shared/unit-audio-continuous.css" rel="stylesheet">
<style>
html,body{overflow:hidden;}
body{margin:0;background:transparent;min-height:0!important;}
body::after{display:none!important;height:0!important;}
.container{width:100%;max-width:none;margin:0;padding:0;}
.card,.lesson,.pronunciation-section{width:100%;max-width:none;margin-left:0!important;margin-right:0!important;box-sizing:border-box;}
.lesson{scroll-margin-top:0;}
.watch-layout{grid-template-columns:1fr!important;}
.watch-video-frame{width:100%;}
.watch-video,.main-video.watch-video{display:block;width:100%!important;height:auto!important;aspect-ratio:16/9!important;object-fit:cover!important;}
.nav,.flw-unit-topbar,.footer{display:none!important;}
</style>
</head>
<body>
<main class="container">
<section class="lesson watch-lesson" id="watch-lesson">
  <h2><span></span>Watch-lesson: Unit Video</h2>
  <div class="watch-layout">
    <div class="watch-video-frame">
      <video class="main-video watch-video" controls preload="metadata" src="assets/video/sample02.mp4"></video>
    </div>
    
  </div>
</section>
</main>
<script src="script.js"></script>
<script src="assets/shared/unit-audio-continuous.js"></script>
<script>
(() => {
  const resize = () => {
    const frame = window.frameElement;
    if (!frame) return;
    const body = document.body;
    const html = document.documentElement;
    let bottom = 0;
    Array.from(body.children).forEach((element) => {
      if (element.tagName === 'SCRIPT') return;
      const rect = element.getBoundingClientRect();
      const styles = window.getComputedStyle(element);
      bottom = Math.max(bottom, rect.bottom + window.scrollY + parseFloat(styles.marginBottom || '0'));
    });
    const height = Math.ceil(bottom);
    frame.style.height = `${Math.max(160, height + 8)}px`;
  };
  window.addEventListener('load', resize);
  window.addEventListener('resize', resize);
  if ('ResizeObserver' in window) {
    new ResizeObserver(resize).observe(document.querySelector('main') || document.body);
  }
  setTimeout(resize, 100);
  setTimeout(resize, 600);
  setTimeout(resize, 1500);
  setTimeout(resize, 3000);
  document.querySelectorAll('img,video').forEach((media) => {
    media.addEventListener('load', resize);
    media.addEventListener('loadedmetadata', resize);
  });
})();
</script>
</body>
</html>
